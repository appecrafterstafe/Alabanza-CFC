<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repertorio & Visor de Acordes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Modal / Visor de la Canción -->
  <div id="song-viewer-modal" class="modal">
    <div class="modal-content">
      
      <!-- Barra Superior / Encabezado -->
      <div class="modal-header">
        <div class="song-info">
          <h2 id="viewer-title">Cargando canción...</h2>
          <span id="viewer-artist-album" class="subtitle">Artista • Álbum</span>
        </div>
        <button id="close-modal-btn" class="close-btn">&times;</button>
      </div>

      <!-- Badges de Tono y BPM -->
      <div class="badges-bar">
        <span id="viewer-key" class="badge">Tono: -</span>
        <span id="viewer-bpm" class="badge">BPM: -</span>
        <button id="toggle-yt-btn" class="yt-toggle-btn" style="display: none;">
          ▶ Mostrar Audio/YouTube
        </button>
      </div>

      <!-- Reproductor Flotante/Colapsable de YouTube -->
      <div id="youtube-player-container" class="yt-container collapsed">
        <iframe 
          id="youtube-iframe" 
          src="" 
          title="Reproductor de YouTube" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>

      <!-- Visor Principal del PDF / Acordes -->
      <div class="pdf-viewer-box">
        <iframe id="viewer-pdf-iframe" src="" frameborder="0"></iframe>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
