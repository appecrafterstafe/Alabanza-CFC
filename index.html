<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repertorio & Visor de Acordes</title>

  <style>
    /* Estilos Generales */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 20px;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    /* Tabla Principal de Canciones */
    .song-list {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .song-list th, .song-list td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
    }

    .song-list th {
      background-color: #1f2937;
      color: #ffffff;
      font-weight: 600;
    }

    .song-row {
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .song-row:hover {
      background-color: #f9fafb;
    }

    .open-btn {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }

    .open-btn:hover {
      background-color: #1d4ed8;
    }

    /* Modal / Visor del PDF */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #ffffff;
      width: 95%;
      max-width: 900px;
      height: 90vh;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    /* Encabezado del Visor */
    .modal-header {
      padding: 16px 20px;
      background: #1f2937;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .song-info h2 { margin: 0; font-size: 1.25rem; }
    .song-info .subtitle { font-size: 0.875rem; color: #9ca3af; }

    .close-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
    }

    /* Barra de Badges (Tono y BPM) */
    .badges-bar {
      padding: 10px 20px;
      background: #f3f4f6;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .badge {
      background: #e5e7eb;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
    }

    /* Visor del PDF */
    .pdf-viewer-box {
      flex: 1;
      width: 100%;
      background: #e5e7eb;
    }

    .pdf-viewer-box iframe {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Repertorio de Canciones</h1>
    
    <!-- Tabla Principal -->
    <table class="song-list">
      <thead>
        <tr>
          <th>Canción</th>
          <th>Artista</th>
          <th>Tono</th>
          <th>BPM</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="songs-table-body">
        <!-- Se completa con JS -->
      </tbody>
    </table>
  </div>

  <!-- Modal / Visor de la Canción -->
  <div id="song-viewer-modal" class="modal">
    <div class="modal-content">
      
      <div class="modal-header">
        <div class="song-info">
          <h2 id="viewer-title">Título</h2>
          <span id="viewer-artist-album" class="subtitle">Artista</span>
        </div>
        <button id="close-modal-btn" class="close-btn">&times;</button>
      </div>

      <div class="badges-bar">
        <span id="viewer-key" class="badge">Tono: -</span>
        <span id="viewer-bpm" class="badge">BPM: -</span>
      </div>

      <!-- Visor de PDF / Letra -->
      <div class="pdf-viewer-box">
        <iframe id="viewer-pdf-iframe" src="" frameborder="0"></iframe>
      </div>

    </div>
  </div>

  <script>
    // Ejemplo de filas (Estructura de la Columna A a la F)
    const sampleRows = [
      ["De Música Ligera", "Soda Stereo", "", "Bm", "125", "https://drive.google.com/file/d/12345/view"],
      ["Flaca", "Andrés Calamaro", "", "G", "92", "https://drive.google.com/file/d/67890/view"]
    ];

    // Mapeo directo de Columnas (A a la F)
    function mapSheetRowToSong(row) {
      return {
        title: row[0] || '',      // Columna A (Canción)
        artist: row[1] || '',     // Columna B (Artista)
        albumCover: row[2] || '', // Columna C (Álbum / Imagen)
        key: row[3] || '',        // Columna D (Tono)
        bpm: row[4] || '',        // Columna E (BPM)
        driveUrl: row[5] || ''    // Columna F (PDF / Letra en Drive)
      };
    }

    // Convierte enlace de Drive a formato Preview
    function getDriveEmbedUrl(url) {
      if (!url) return '';
      return url.replace(/\/view.*$/, '/preview');
    }

    // Dibujar la tabla
    function renderSongsTable(rows) {
      const tbody = document.getElementById('songs-table-body');
      tbody.innerHTML = '';

      rows.forEach(row => {
        const song = mapSheetRowToSong(row);
        const tr = document.createElement('tr');
        tr.className = 'song-row';
        tr.innerHTML = `
          <td><strong>${song.title}</strong></td>
          <td>${song.artist}</td>
          <td>${song.key}</td>
          <td>${song.bpm}</td>
          <td><button class="open-btn">Ver Acordes</button></td>
        `;
        
        tr.addEventListener('click', () => openSongViewer(song));
        tbody.appendChild(tr);
      });
    }

    // Abrir Visor PDF
    function openSongViewer(song) {
      document.getElementById('viewer-title').textContent = song.title;
      document.getElementById('viewer-artist-album').textContent = song.artist;
      document.getElementById('viewer-key').textContent = `Tono: ${song.key}`;
      document.getElementById('viewer-bpm').textContent = `BPM: ${song.bpm}`;

      const pdfIframe = document.getElementById('viewer-pdf-iframe');
      pdfIframe.src = song.driveUrl ? getDriveEmbedUrl(song.driveUrl) : '';

      document.getElementById('song-viewer-modal').classList.add('active');
    }

    // Eventos
    document.addEventListener('DOMContentLoaded', () => {
      renderSongsTable(sampleRows);

      const modal = document.getElementById('song-viewer-modal');
      const closeBtn = document.getElementById('close-modal-btn');

      closeBtn.addEventListener('click', () => {
        modal.classList.remove('active');
        document.getElementById('viewer-pdf-iframe').src = '';
      });
    });
  </script>
</body>
</html>
