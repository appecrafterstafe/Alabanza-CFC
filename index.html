<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Partituras y Acordes</title>
  <style>
    :root {
      --brand-mint: #00ffd5;
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --text-light: #ffffff;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      margin: 0;
      padding: 20px;
    }

    /* Modal / Visor */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background-color: #1a1a1a;
      border-bottom: 1px solid #333;
    }

    .modal-title-wrapper {
      text-align: center;
    }

    .modal-title-wrapper h3 {
      margin: 0;
      font-size: 1.1rem;
    }

    .sub-artist {
      font-size: 0.85rem;
      color: #aaa;
    }

    .modal-header-actions {
      display: flex;
      gap: 10px;
    }

    .icon-btn, .nav-arrow {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 1rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .icon-btn:hover, .nav-arrow:hover {
      background: #3a3a3a;
    }

    .icon-btn.active-invert {
      background: var(--brand-mint);
      color: #000;
      border-color: var(--brand-mint);
    }

    .modal-body {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background-color: #fff;
      transition: filter 0.3s ease;
    }

    /* Inversión de colores para vista oscura */
    .modal-body.inverted {
      filter: invert(1) hue-rotate(180deg);
    }

    .modal-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Modal del Visor -->
  <div id="viewerModal" class="modal">
    <div class="modal-header">
      <button id="prevBtn" class="nav-arrow" onclick="navigateSong(-1)" title="Anterior">◀</button>
      <div class="modal-title-wrapper">
        <h3 id="modalTitle">Título de la canción</h3>
        <span id="modalArtist" class="sub-artist">Artista</span>
      </div>
      <button id="nextBtn" class="nav-arrow" onclick="navigateSong(1)" title="Siguiente">▶</button>
      <div class="modal-header-actions">
        <button id="invertBtn" class="icon-btn" onclick="toggleInvertColors()" title="Invertir colores (Modo oscuro)">🌓</button>
        <a id="externalLinkBtn" class="icon-btn" target="_blank" title="Abrir archivo original">↗</a>
        <button class="icon-btn" onclick="closeViewer()" title="Cerrar">&times;</button>
      </div>
    </div>
    <div class="modal-body" id="modalBody">
      <iframe id="pdfFrame" src=""></iframe>
    </div>
  </div>

  <script>
    // Estado global del visor
    let currentSongIndex = 0;
    let currentFileType = 'acordes';
    let isInverted = false;

    // Ejemplo de estructura de datos de canciones
    const songs = [
      {
        id: 1,
        title: "Ejemplo Canción 1",
        artist: "Artista A",
        urlAcordes: "https://drive.google.com/file/d/1ABC123456789xyz/view",
        urlLetra: "https://docs.google.com/document/d/1DEF987654321abc/edit"
      }
    ];

    /**
     * Ajusta la URL de Google Drive / Docs para permitir interactividad y ZOOM
     */
    function getEmbedUrl(rawUrl) {
      if (!rawUrl) return '';
      
      let id = null;
      let match = rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        id = match[1];
      } else {
        match = rawUrl.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        if (match && match[1]) id = match[1];
      }

      if (id) {
        // Para Google Docs usa modo móvil (permite pinch-to-zoom nativo)
        if (rawUrl.includes('docs.google.com/document')) {
          return `https://docs.google.com/document/d/${id}/mobilebasic`;
        }
        // Para PDFs/Drive usa la vista nativa con controles habilitados
        return `https://drive.google.com/file/d/${id}/view?usp=sharing`;
      }
      
      return rawUrl;
    }

    /**
     * Abre el visor con la canción y tipo seleccionados
     */
    function openViewer(id, type = 'acordes') {
      const index = songs.findIndex(s => s.id === id);
      if (index === -1) return;

      currentSongIndex = index;
      currentFileType = type;
      
      // Siempre abre en modo normal (no invertido) por defecto
      setInvertColors(false);

      loadCurrentSong();
      document.getElementById('viewerModal').style.display = 'flex';
    }

    /**
     * Carga el archivo en el iframe según el índice y tipo actual
     */
    function loadCurrentSong() {
      const song = songs[currentSongIndex];
      if (!song) return;

      let targetUrl = song.urlAcordes || song.urlLetraAcordes || song.urlLetra;
      if (currentFileType === 'letra' && song.urlLetra) targetUrl = song.urlLetra;
      if (currentFileType === 'letra-acordes' && song.urlLetraAcordes) targetUrl = song.urlLetraAcordes;
      if (currentFileType === 'acordes' && song.urlAcordes) targetUrl = song.urlAcordes;

      document.getElementById('modalTitle').innerText = song.title;
      document.getElementById('modalArtist').innerText = song.artist || '';
      document.getElementById('externalLinkBtn').href = targetUrl || '#';
      document.getElementById('pdfFrame').src = getEmbedUrl(targetUrl);
    }

    /**
     * Navega entre canciones manteniendo el tipo de archivo seleccionado
     */
    function navigateSong(direction) {
      const newIndex = currentSongIndex + direction;
      if (newIndex >= 0 && newIndex < songs.length) {
        currentSongIndex = newIndex;
        loadCurrentSong();
      }
    }

    /**
     * Cambia/asigna el estado de inversión de colores
     */
    function setInvertColors(enable) {
      isInverted = enable;
      const modalBody = document.getElementById('modalBody');
      const invertBtn = document.getElementById('invertBtn');

      if (isInverted) {
        modalBody.classList.add('inverted');
        if (invertBtn) invertBtn.classList.add('active-invert');
      } else {
        modalBody.classList.remove('inverted');
        if (invertBtn) invertBtn.classList.remove('active-invert');
      }
    }

    /**
     * Alterna manualmente los colores al presionar el botón 🌓
     */
    function toggleInvertColors() {
      setInvertColors(!isInverted);
    }

    /**
     * Cierra el visor y limpia el iframe y estados
     */
    function closeViewer() {
      document.getElementById('viewerModal').style.display = 'none';
      document.getElementById('pdfFrame').src = '';
      setInvertColors(false);
    }
  </script>
</body>
</html>
